<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            border: none;
            background-color: darkcyan;
            color: white;
            font-size: 20px;
            margin:  100px auto;
            display: block;
            padding: 5px 9px;
            /* outline: none; */
            /* outline: 4px solid orangered; */
            outline-offset: 4px;
            transition: 2s;
        }

        button:hover {
            outline: 6px solid purple;
            outline-offset: 10px;
            color: brown;
        }
    </style>
</head>

<body>
    <button>shop now</button>
</body>

</html>
