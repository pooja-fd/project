<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 100px;
            width: 100px;
            background-color: pink;
            position: relative;
        }
        .effect{
            height: inherit;
            width: inherit;
            background: lightgreen;
            transform: scale(0);
            transition: .5s;
        }
        .main:hover .effect{
            transform: scale(1);
        }
        b{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="effect"></div>
        <b>pooja</b>
    </div>
</body>
</html>
