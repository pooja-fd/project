<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .navbar {
            background: grey;
        }

        ul {
            background: lightgreen;
            text-align: center;
            padding: 20px 0px;
        }

        li {
            background: lightblue;
            /* border: 2px dashed black; */
            display: inline;
            margin-right: 30px;
            padding: 16px 10px;
            position: relative;

        }

        a {
            text-decoration: none;
            color: red;
            font-size: 30px;
            font-weight: bold;
            font-style: italic;
        }

        li::after {
            content: "";
            height: 5px;
            /* width: 10%; */
            width: 0%;
            background: violet;
            position: absolute;
            /* top: 0px; */
            bottom: 0;
            /* top: 100%; */
            left: 0;
            transition: 1s;
        }
        li:hover::after{
            width: 100%;
    
        }
        li::before{
            content: "";
            height: 5px;
            width: 0%;
            background: darkblue;
            position: absolute;
            top: 0%;
            /* bottom: 0; */
            /* top: 100%; */
            left: 0;
            transition: 1s;
        }
        li:hover::before{
            width: 90%;
        }
    </style>
</head>

<body>
    <!-- before n after apply krke hover effcet -->
    <div class="nav">
        <ul>
            <li>
                <a href="">Home</a>
            </li>
            <li>
                <a href="">About</a>
            </li>
            <li>
                <a href="">Service</a>
            </li>
            <li>
                <a href="">contact</a>
            </li>
        </ul>
    </div>
</body>

</html>
