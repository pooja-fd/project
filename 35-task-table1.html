<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main 
        {
            background: darkcyan;
            padding: 10px;
        }

        .main p 
        {
            background: darkgoldenrod;
        }
        .main1 
        {
            background: darkgreen;
            display: flex;
            text-align: center;
           
           
        }
        .left 
        {
            background: gray;
            width: 200px;
        }
        .right 
        {
            background: darkkhaki;
            width: 500px;
        }
        .left div,.right div 
        {
           background: red;
           /* margin: 10px 0; */
           border: 3px solid;
           padding: 25px 0;
        }
        .left div 
        {
            height: 80px;
            font-size: 40px;
        }
        input 
        {
            height: 40px;
            width: 80%;
        }

        .right div 
        {
           height: 80px;
        }

        .right div:nth-child(4)
        {
            text-align: left;
        } 
    </style>
</head>
<body>
    <div class="main">
        <p>contact form</p>
        <div class="main1">
            <div class="left">
                <div>1</div>
                <div>2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                <div>6</div>
            </div>
            <div class="right">
                <div><input type="text"></div>
                <div><input type="text"></div>
                <div><input type="text"></div>
                <div class="x"><textarea name="" rows="5" cols="30" id=""></textarea></div>
                <div><input type="text"></div>
                <div><input type="text"></div>
            </div>
        </div>
    </div>
    
</body>
</html>
