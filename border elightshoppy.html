<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      img{
        width: 400px;
      }
      .blur{
        filter: blur(2px);
      }
      .bright{
        filter: brightness(300%);
      }
      .contrast{
        filter: contrast(100%);
      }
      .bw{
        filter: grayscale(100%);
      }
      .sephia{
        filter: sepia(160%);
      }
      .hue{
        filter: hue-rotate(-55deg);
      }
      .invert{
        filter: invert(100%);
      }
      .xyz{
        height: 100px;
        width:100px ;
        background: darkgoldenrod;
        box-shadow: 0 0 20px blue inset;
      }
    </style>
</head>
<body>
    <div class="xyz">

    </div>
    <img src= "https://palti28.github.io/ulosZone/images/banner1.jpg" alt="" width="100%" height="100%" class="blur">
    <img src="https://palti28.github.io/ulosZone/images/banner1.jpg" alt="" width="100%" height="100%" class="bright">
    <img src="https://palti28.github.io/ulosZone/images/banner1.jpg" alt="" width="100%" height="100%" class="constrast">
    <img src="https://palti28.github.io/ulosZone/images/banner1.jpg" alt="" width="100%" height="100%" class="bw">
    <img src="https://palti28.github.io/ulosZone/images/banner1.jpg" alt="" width="100%" height="100%" class="sephia">
    <img src="https://palti28.github.io/ulosZone/images/banner1.jpg" alt="" width="100%" height="100%" class="hue">
    <img src="https://palti28.github.io/ulosZone/images/banner1.jpg" alt="" width="100%" height="100%" class="invert">
</body>
</html>
