<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 900px;
            width: 900px;
            box-shadow: 5px 5px 0px black;
            text-align: center;
        }
        .a{
            display: grid;
            grid-template-columns: repeat(auto-fit,200px);
            /* border: 2px solid red; */
            background-color: aqua;
            display:inline-block;
            font-size: 20px;
            height: 120px;
            width: 320px;
        }
            /* .a1{
                height: 50px;
                width: 50px;
                background-color: pink;
                padding: 10px;
            } */
    </style>
</head>
<body>
    <div class="box">
        <h1>css grid</h1>
        <div class="a">hello  
            <div class="a1"></div>
        </div>
    </div>
</body>
</html>
