<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn-script.com/ajax/libs/jquery/3.7.1/jquery.js" type="text/javascript"></script>
    <style>
        .box {
            height: 200px;
            width: 200px;
            background-color: lightblue;
        }
        .borderclass{
            
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <button class="down">slide down</button>
    <button class="up">slide up</button>
    <button class="togle">slidetoggle</button>
    <script>
        $('.down').click(() => {
            $('.box').slideDown()
        })

         $('.up').click(() => {
            $('.box').slideUp()
        })
         $('.togle').click(() => {
            $('.box').slideToggle()
        })


    

    

            $(".box").click(function () {
                $(".box").css("border","3px solid red");
            
            });


    </script>
</body>

</html>
