<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .div{
            background: url('https://aykhanhuseyn.github.io/eliteshoppy.github.io/img/bottom2.jpg');
            height: 200px;
            width: 440px;
            background-size: 100% 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-position: -20px 0;
            transition: 0.5s;
            margin: 50px auto;
        }
        .border{
            height: 140px;
            width: 360px;
            border: 5px solid white;
            opacity: 0;
            margin-left: -30px;
            transition: 0.5s;
        }
        .div:hover .border{
            
            /* margin-left:; */
            opacity: 1;  
        }
        .div:hover{
            background-position: 0;
        }
    </style>
</head>
<body>
    <div class="div">
        <div class="border"></div>
    </div>
</body>
</html>
