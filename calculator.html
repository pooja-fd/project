<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JS Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.js">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }

        .calculator {
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 300px;
            background-color: #fff;
            padding: 20px;
        }

        .calculator-display {
            width: calc(100% - 20px);
            /* Adjust for padding */
            height: 60px;
            font-size: 2.5em;
            text-align: right;
            margin-bottom: 20px;
            padding: 0 10px;
            border: 1px solid #eee;
            border-radius: 5px;
            background-color: #e9e9e9;
            color: #333;
            box-sizing: border-box;
            /* Include padding in width */
        }

        .calculator-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .button {
            width: 100%;
            height: 60px;
            font-size: 1.5em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            background-color: #f0f0f0;
            color: #333;
        }

        .button:hover {
            background-color: #e0e0e0;
        }

        .button.number {
            background-color: #e9e9e9;
        }

        .button.operator {
            background-color: #f5923e;
            color: white;
        }

        .button.operator:hover {
            background-color: #d67a2b;
        }

        .button.equal {
            background-color: #4CAF50;
            color: white;
            grid-column: span 2;
            /* Make the equals button span two columns if desired */
        }

        .button.equal:hover {
            background-color: #45a049;
        }

        .button.zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <input type="text" class="calculator-display" id="calculatorDisplay" readonly>
        <div class="calculator-buttons">
            <button class="button operator" data-action="clear">AC</button>
            <button class="button operator" data-action="backspace">DEL</button>
            <button class="button operator" data-action="percentage">%</button>
            <button class="button operator" data-action="divide">/</button>

            <button class="button number">7</button>
            <button class="button number">8</button>
            <button class="button number">9</button>
            <button class="button operator" data-action="multiply">*</button>

            <button class="button number">4</button>
            <button class="button number">5</button>
            <button class="button number">6</button>
            <button class="button operator" data-action="subtract">-</button>

            <button class="button number">1</button>
            <button class="button number">2</button>
            <button class="button number">3</button>
            <button class="button operator" data-action="add">+</button>

            <button class="button number zero">0</button>
            <button class="button number" data-action="decimal">.</button>
            <button class="button equal" data-action="calculate">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
