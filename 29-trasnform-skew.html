<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .x,.y 
        {
            height: 100px;
            width: 100px;
            border:5px solid;
            margin: auto;
        }
        .y
        {
            transform: skew(45deg);
            transform: skew(-20deg);
        }
    </style>
</head>
<body>

    <div class="x">DIV X</div>
    <div class="y">DIV Y</div>
    
</body>
</html>
