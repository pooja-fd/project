<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height:200px ;
            width: 200px;
            background-color: lightpink;
            animation: fervo 5s infinite alternate;
        }
        @keyframes fervo{
            0%{
                border-radius: 50%;
            }
            25%{
                margin-left: 200px;
            }
            50%{
                background-color: darkblue;
                margin-top: 200px;
                margin-left: 200px;
            }
            75%{
                margin-top: 200px;
            }
            100%{
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
