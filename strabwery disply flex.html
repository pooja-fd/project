<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>*{
        box-sizing: border-box;
        /* margin: 0; */
    }
        .container{
            margin: 200px auto;
            text-align: center;
            background-color: #ffff;
        }
        .imag{
        
            height: 200px;
        }
        img{
            width: 250px;
            background: transparent;
        }
        .info{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .col1, .col2, .col3{
            margin-bottom: 35px;
        }
        h1{
            color: red;
            font-size: 35px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="imag">
            <img src="https://cdn.britannica.com/22/75922-050-D3982BD0/flowers-fruits-garden-strawberry-plant-species.jpg" alt="" height="100%">
        </div>
        <h1>strawberries</h1>
        <div class="pargraph">
            <p>The garden strawberry is a widely grown hybrid</p>
            <p>species of the gentus Fragaria .it is cultivated wolrd wide for its fruits.</p>
        </div>
        <div class="info">
            <div class="col1">
                <h3>Quantity</h3>
                 <span>1</span>
            </div>
            <div class="col2">
                <h3>Total price</h3>
                <span>$ 7</span>
            </div>
            <div class="col3">
                <h3>Delivery</h3>
                <span>in 60 mins</span>
            </div>
        </div>
       
    </div>

</body>

</html>
