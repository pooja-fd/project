<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        input:hover {
            background: pink;
            border: none;
        }

        input:focus {
            background: red;
            color: blue;
        }

        .main,
        .effect {
            height: 100px;
            width: 100px;
            background-color: black;
            margin: 100px auto;
            border-radius: 50%;
        }

        .effect {
            background: pink;
            opacity: 1;
            /* display: block; */
            /* visibility: visible; */
            /* transition:  .9s;two way ma apoto */
            transform: scale(1);

        }

        .effect:hover {
            transform: scale(1.5);
            opacity: 0;
            /* display: none; */
            /* visibility: hidden; */
            transition: .65s;
        }

        .playbutton {
            height: 100px;
            width: 100px;
            font-size: 45px;
            background-color: lightblue;
            text-align: center;
            line-height: 100px;
            margin: 100px auto;
            position: relative;
            z-index: 0;
            border-radius: 50%;
        }

        .effect1 {
            height: inherit;
            width: inherit;
            background: lightcoral;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 1;
            z-index: -1;
            border-radius: 50%;

        }

        .effect1:hover {
            opacity: 0;
            transform: scale(1.5);
            transition: 2s;
        }

        .playbutton:hover.effect1 {
            opacity: 0;
            transform: scale(1.5);
            transition: 3s;
        }

        .playbutton1 {
            height: 100px;
            width: 100px;
            font-size: 45px;
            background-color: lightblue;
            text-align: center;
            line-height: 100px;
            margin: 100px auto;
            position: relative;
            z-index: 0;
            border-radius: 50%;
        }

        .playbutton1::after {
            content: "";
            height: inherit;
            width: inherit;
            background-color: blueviolet;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
            border-radius: 50%;
        }

        .playbutton1:hover::after {
            transform: scale(1.5);
            transition: 2s;
            opacity: 0;
        }

        .playbutton1::before {
            content: "";
            height: inherit;
            width: inherit;
            background-color: red;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 50%;
            z-index: -1;
        }

        .playbutton:hover::before {
            transform: scale(2);
            transition: 1s;
            opacity: 0;
        }
    </style>
</head>

<body>
    <!-- <div>
        link
        <input type="text">
    </div> -->
    <!-- (1) -->
    <div class="main">
        <div class="effect"></div>
    </div><br>


    <!-- (2)play button icon code -->
    <div class="playbutton">
        <i class="fa-solid fa-play"></i>
        <div class="effect1"></div>
    </div>

    <!-- (3) playbutton after n before icon -->
    <div class="playbutton1">
        <i class="fa-solid fa-play"></i>
    </div>
</body>

</html>
