        // exmple 2
        function countdown(n) {
            if (n === 0)
             {
                console.log("Done!");
                return;  // Base condition (stop recursion)
            }
            document.write(n)
            console.log(n);
            setTimeout(() => {
                countdown(n - 1); // Recursion ho raha `setTimeout` ke andar!
            }, 1000); // Har step pe 1 second ka delay

            setTimeout(countdown(n-1) ,1000)
        }

        countdown(5);


    </script>
