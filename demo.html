<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <p id="p">Lorem ipsum dolor sit ame. Libero accusantium enim iste rem voluptatem, pariatur error
        aliquam inven Quidem mollitia maiores ipsum illum.</P>
        
    <button id="btn3" onclick="get()">hide</button>

    <script>
          let btn12 = document.getElementById('btn3')
            let p1 = document.querySelector('p')
          function get ()
          {
            if (p1.style.visibility == "visible" )
            {
                    p1.style.visibility = "hidden"
                    btn12.innerHTML = "show"
            }
            else{
                p1.style.visibility = "visible"
                btn12.innerHTML= "hide"
            }
          }
      </script>
</body>
</html>
